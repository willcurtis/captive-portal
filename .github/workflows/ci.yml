name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: bash -n install.sh scripts/update.sh scripts/verify.sh caddy-entrypoint.sh
      - run: docker build --tag unifi-captive-portal:test .
      - run: docker build --file Dockerfile.caddy --tag unifi-captive-portal-caddy:test .
